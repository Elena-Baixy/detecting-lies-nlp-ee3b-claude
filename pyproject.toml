[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for detecting different types of lies in LLMs"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.7.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "openai>=2.26.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
